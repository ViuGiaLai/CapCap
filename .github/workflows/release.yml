name: Build and Release CapCap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          pip install -r requirements-local.txt

      - name: Download & setup FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/ffmpeg
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force
          $binDir = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -ExpandProperty DirectoryName -First 1
          Copy-Item "$binDir\ffmpeg.exe" -Destination "bin/ffmpeg/ffmpeg.exe"
          Copy-Item "$binDir\ffprobe.exe" -Destination "bin/ffmpeg/ffprobe.exe"
          Write-Host "FFmpeg setup completed."

      - name: Download Silero VAD & Base Models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          New-Item -ItemType Directory -Force -Path models/sensevoice
          New-Item -ItemType Directory -Force -Path models/piper

          # Download Silero VAD
          Invoke-WebRequest -Uri "https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx" -OutFile "bin/silero_vad.onnx"

          # Download SenseVoice Small ONNX
          Invoke-WebRequest -Uri "https://huggingface.co/FunAudioLLM/SenseVoiceSmall-ONNX/resolve/main/model.int8.onnx" -OutFile "models/sensevoice/model.int8.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/FunAudioLLM/SenseVoiceSmall-ONNX/resolve/main/tokens.txt" -OutFile "models/sensevoice/tokens.txt"

          Write-Host "Base models setup completed."

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $env:CAPCAP_WINDOWED_BUILD = "1"
          pyinstaller --noconfirm CapCap.spec

      - name: Create Release Zip Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "CapCap-$tag-Windows-x64.zip"
          Compress-Archive -Path "dist/CapCap/*" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
